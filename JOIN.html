<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Umbral Covenant</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root{
  --bg-dark:#0e0e13;
  --bg-panel:#181820;
  --accent-purple:#7a3cff;
  --accent-soft:#b28dff;
  --accent-crimson:#b3002d;
  --text-light:#d6d6e0;
  --text-dim:#8b8b9d;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  background: radial-gradient(circle at top,#1a1a22,#0e0e13);
  font-family:'Share Tech Mono',monospace;
  color:var(--text-light);
  overflow-x:hidden;
}

/* ===== FRAME ===== */
.frame{position:fixed;inset:12px;border:1px solid rgba(122,60,255,0.5);pointer-events:none;z-index:1000;}
.moon-frame{position:fixed;top:12px;left:12px;right:12px;height:80px;pointer-events:none;z-index:1001;}
.moon-frame svg{width:100%;height:100%;}

/* ===== HEADER ===== */
header{text-align:center;padding:120px 20px 60px;}
header h1{font-family:'Cinzel',serif;font-size:3rem;color:var(--accent-purple);text-shadow:0 0 20px var(--accent-purple);}
header p{margin-top:10px;color:var(--text-dim);}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,15,0.92);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:center;z-index:2000;}
.modal{background:var(--bg-panel);border:1px solid rgba(122,60,255,0.6);padding:40px;width:320px;text-align:center;box-shadow:0 0 30px rgba(122,60,255,0.3);}
.modal h2{font-family:'Cinzel',serif;color:var(--accent-soft);margin-bottom:20px;}
.modal input{width:100%;padding:10px;background:#111118;border:1px solid #333;color:var(--text-light);margin-bottom:20px;}
.modal button{padding:10px 20px;background:transparent;border:1px solid var(--accent-purple);color:var(--accent-soft);cursor:pointer;transition:.3s;}
.modal button:hover{background:var(--accent-purple);color:#fff;}

/* ===== AVATAR & GREETING ===== */
.avatar-section{height:120vh;display:flex;align-items:center;justify-content:center;}
.avatar-container{text-align:center;opacity:0;transform:translateY(80px);transition:1.2s ease;}
.avatar-container.visible{opacity:1;transform:translateY(0);}
.avatar-container img{max-height:480px;filter:drop-shadow(0 0 25px rgba(122,60,255,0.7));}
.greeting{font-family:'Cinzel',serif;font-size:2rem;margin-top:20px;color:var(--accent-soft);min-height:40px;}

/* ===== SECTIONS ===== */
.section{max-width:900px;margin:80px auto;padding:40px;background:var(--bg-panel);border:1px solid rgba(122,60,255,0.3);}
.section h2{font-family:'Cinzel',serif;margin-bottom:20px;color:var(--accent-soft);}

/* ===== FORM ===== */
.coven-form{display:flex;flex-direction:column;gap:14px;}
.coven-form input,.coven-form textarea{background:#0f0f14;border:1px solid rgba(122,60,255,0.4);color:var(--text-light);padding:12px;}
.coven-form button{background:transparent;border:1px solid var(--accent-purple);color:var(--accent-soft);padding:12px;cursor:pointer;transition:.3s;}
.coven-form button:hover{background:var(--accent-purple);color:#fff;box-shadow:0 0 15px rgba(122,60,255,0.6);}

/* ===== RITUAL EFFECTS ===== */
.ritual-flash{position:fixed;inset:0;background:rgba(179,0,45,0.4);animation:flashFade .8s forwards;pointer-events:none;z-index:3000;}
@keyframes flashFade{from{opacity:1;}to{opacity:0;}}

/* ===== MESSAGE PULSE ===== */
.message-container{text-align:center;animation:fadeInHeart 1.8s ease forwards;}
@keyframes fadeInHeart{from{opacity:0;transform:scale(0.6);}to{opacity:1;transform:scale(1);}}
.ritual-message{
  font-family:'Cinzel',serif;
  font-size:1.6rem;
  color:#ffb3d1;
  letter-spacing:1px;
  min-height:50px;
  display:inline-block;
}
.pulse-text{
  animation: textPulse 3s infinite ease-in-out;
}
@keyframes textPulse{
  0%,100%{transform:scale(1); text-shadow:0 0 12px #ff4d94,0 0 25px #b28dff;}
  50%{transform:scale(1.05); text-shadow:0 0 25px #ff4d94,0 0 45px #b28dff;}
}

footer{text-align:center;padding:60px;font-size:.8rem;color:var(--text-dim);}
</style>
</head>

<body>
<div class="frame"></div>
<div class="moon-frame">
<svg viewBox="0 0 1000 200" preserveAspectRatio="none">
<path d="M0,0 L1000,0 L1000,40 Q500,120 0,40 Z" fill="none" stroke="rgba(122,60,255,0.6)" stroke-width="2"/>
</svg>
</div>

<!-- Name Entry Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>State Your Name</h2>
    <input type="text" id="nameInput" placeholder="Enter your name...">
    <button onclick="enterSite()">Enter</button>
  </div>
</div>

<header>
  <h1>The Umbral Covenant</h1>
  <p>We do not fear the dark. We shine brighter in Yeshua.</p>
</header>

<section class="avatar-section">
  <div class="avatar-container" id="avatar">
    <img src="https://i.imgur.com/8Km9tLL.png" alt="Avatar">
    <div class="greeting" id="greetingText"></div>
  </div>
</section>

<section class="section">
  <h2>Petition the Covenant</h2>
  <form action="https://formbold.com/s/6QZjK" method="POST" class="coven-form" id="covenForm">
    <input type="text" name="name" placeholder="Your Chosen Name" required>
    <input type="email" name="email" placeholder="Your Contact Email" required>
    <textarea name="backstory" rows="4" placeholder="Why do you seek the Covenant?" required></textarea>
    <button type="submit">Seal the Oath</button>
  </form>
</section>

<footer>© 2026 The Umbral Covenant</footer>

<script>
const avatar = document.getElementById("avatar");
const greeting = document.getElementById("greetingText");
const modal = document.getElementById("modal");
const form = document.getElementById("covenForm");

/* Scroll reveal */
window.addEventListener("scroll", () => {
  if (avatar.getBoundingClientRect().top < window.innerHeight - 100) {
    avatar.classList.add("visible");
  }
});

/* Modal entry */
function enterSite() {
  const name = document.getElementById("nameInput").value.trim() || "Wanderer";
  modal.style.display = "none";
  let text = "Greetings, " + name + ".";
  let i = 0;
  (function typeWriter() {
    if (i < text.length) {
      greeting.textContent += text.charAt(i++);
      setTimeout(typeWriter, 60);
    }
  })();
}

/* Form submission & ritual */
form.addEventListener("submit", async e => {
  e.preventDefault();
  const data = new FormData(form);
  const name = data.get("name") || "Beloved";

  try {
    await fetch(form.action, { method:"POST", body:data, headers:{Accept:"application/json"} });
  } catch(err) { /* even if FormBold fails, ritual still triggers */ }

  initiateRitual(name);
});

/* Ritual function with pulsing message */
function initiateRitual(userName){
  // flash
  const flash = document.createElement("div");
  flash.className = "ritual-flash";
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 800);

  // fade form
  form.style.transition = "1.2s ease";
  form.style.opacity = "0";

  setTimeout(() => {
    form.innerHTML = `
      <div class="message-container">
        <div class="ritual-message" id="ritualMessage"></div>
      </div>`;

    const el = document.getElementById("ritualMessage");
    el.classList.add("pulse-text");

    const msg = "Message received. Your oath echoes in the Covenant, " + userName + ".";
    let i = 0;
    (function typeWriter(){
      if(i < msg.length){
        el.textContent += msg.charAt(i++);
        setTimeout(typeWriter, 45);
      }
    })();
  }, 1200);
}
</script>

</body>
</html>
