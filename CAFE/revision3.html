<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chez Chat Cafe</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #050010;
}
</style>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturCook:wght@700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

/* ===== GLOBAL ===== */
body {
    font-family: 'Cinzel', serif;
    color: white;
    overflow: hidden;
}

/* ===== LIGHT RAYS ===== */
.light-rays {
    position: fixed;
    inset: -50%;
    background: radial-gradient(circle,
        rgba(138,43,226,0.18),
        rgba(100,149,237,0.15),
        rgba(75,0,130,0.18),
        transparent 60%);
    animation: rotateRays 120s linear infinite;
    pointer-events: none;
}
@keyframes rotateRays {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ===== PARTICLES ===== */
.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
}
.crystal {
    position: absolute;
    width: 10px;
    height: 20px;
    background: linear-gradient(violet, cornflowerblue);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    opacity: 0.6;
    animation: drift linear infinite;
}
@keyframes drift {
    from { transform: translateY(-100vh); }
    to { transform: translateY(100vh); }
}

/* ===== LOADING ===== */
#loading-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(to top, #2e0066, #4b0082, #6495ed);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.castle-3d { display: flex; gap: 20px; }
.tower {
    width: 60px;
    background: linear-gradient(145deg, violet, cornflowerblue, #4b0082);
    clip-path: polygon(50% 0%, 100% 25%, 75% 100%, 25% 100%, 0% 25%);
    box-shadow: 0 0 40px violet;
    animation: float 2s infinite alternate ease-in-out;
}
.t1 { height: 180px; }
.t2 { height: 220px; }
.t3 { height: 160px; }

@keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-18px); }
}

.epic-core {
    margin-top: 40px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid cornflowerblue;
    box-shadow: 0 0 60px violet, inset 0 0 30px cornflowerblue;
    animation: spin 6s linear infinite;
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ===== NAV ===== */
nav {
    display: none;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(20,0,40,0.85);
}
nav ul {
    list-style: none;
    display: flex;
    gap: 30px;
}
nav li {
    cursor: pointer;
    color: cornflowerblue;
}

/* ===== SECTIONS ===== */
.section {
    display: none;
    text-align: center;
    padding: 100px 20px;
}

/* ===== MUTE CRYSTAL ===== */
.mute-crystal {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 60px;
    background: linear-gradient(violet, cornflowerblue);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 20px violet;
    cursor: pointer;
}
.mute-crystal.muted { opacity: 0.4; }

</style>
</head>

<body>

<div class="light-rays"></div>
<div class="particles"></div>

<audio id="bg-music" loop>
    <source src="ambient.mp3" type="audio/mpeg">
</audio>

<audio id="click-sound">
    <source src="chime.mp3" type="audio/mpeg">
</audio>

<div id="loading-screen">
    <div class="castle-3d">
        <div class="tower t1"></div>
        <div class="tower t2"></div>
        <div class="tower t3"></div>
    </div>
    <div class="epic-core"></div>
</div>

<nav>
    <h1>Chez Chat Cafe</h1>
    <ul>
        <li onclick="showSection('home')">Home</li>
        <li onclick="showSection('poetry')">Poetry</li>
        <li onclick="showSection('music')">Music</li>
        <li onclick="showSection('lore')">Lore</li>
    </ul>
</nav>

<div id="home" class="section"><h2>Welcome</h2></div>
<div id="poetry" class="section"><h2>Poetry</h2></div>
<div id="music" class="section"><h2>Music</h2></div>
<div id="lore" class="section"><h2>Lore</h2></div>

<div class="mute-crystal" onclick="toggleMute()"></div>

<script>

/* Floating particles */
const particles = document.querySelector(".particles");
for (let i = 0; i < 40; i++) {
    let c = document.createElement("div");
    c.className = "crystal";
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (6 + Math.random() * 8) + "s";
    particles.appendChild(c);
}

let isMuted = false;

function playClick() {
    if (isMuted) return;
    const click = document.getElementById("click-sound");
    click.currentTime = 0;
    click.play();
}

function toggleMute() {
    const music = document.getElementById("bg-music");
    playClick();
    isMuted = !isMuted;
    music.muted = isMuted;
    document.querySelector(".mute-crystal").classList.toggle("muted");
}

function showSection(id) {
    document.querySelectorAll(".section").forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "block";
    playClick();
}

document.addEventListener("click", function startMusic() {
    document.getElementById("bg-music").play();
    document.removeEventListener("click", startMusic);
});

setTimeout(() => {
    document.getElementById("loading-screen").style.display = "none";
    document.querySelector("nav").style.display = "flex";
    document.getElementById("home").style.display = "block";
    document.body.style.overflow = "auto";
}, 7000);

</script>

</body>
</html>
