<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chez Chat Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturCook:wght@700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #050010;
    font-family: 'Cinzel', serif;
    color: white;
    overflow-x: hidden;
}

/* ===== ACTIVATION SCREEN ===== */
#activation {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: radial-gradient(circle, #140020, #000);
    z-index: 10;
}

.enter-crystal {
    width: 80px;
    height: 100px;
    background: linear-gradient(violet, cornflowerblue);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 40px violet;
    cursor: pointer;
    animation: pulse 2s infinite alternate;
    transition: transform 1s linear;
}

.enter-crystal:hover {
    transform: rotate(360deg);
}

@keyframes pulse {
    from { transform: scale(1); box-shadow: 0 0 20px violet; }
    to { transform: scale(1.1); box-shadow: 0 0 60px cornflowerblue; }
}

/* ===== LOADING / PALACE / SNOW GLOBE ===== */
#loading-screen {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center,
        rgba(138,43,226,0.4),
        rgba(75,0,130,0.9),
        #050010);
    overflow: hidden;
    z-index: 5;

    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.3);
    box-shadow: 0 0 80px rgba(138,43,226,0.5), inset 0 0 40px rgba(255,255,255,0.1);
    width: 80vmin;
    height: 80vmin;
}

.palace-glow {
    position: absolute;
    width: 400px;
    height: 300px;
    background: radial-gradient(circle,
        rgba(100,149,237,0.5),
        transparent 70%);
    filter: blur(40px);
    animation: glowPulse 4s ease-in-out infinite alternate;
}

@keyframes glowPulse {
    from { transform: scale(1); opacity: 0.6; }
    to { transform: scale(1.1); opacity: 1; }
}

.palace {
    display: flex;
    align-items: flex-end;
    gap: 20px;
    z-index: 2;
    transform: translateY(-5%);
}

.tower {
    width: 70px;
    background: linear-gradient(145deg, violet, cornflowerblue, #4b0082);
    clip-path: polygon(50% 0%, 100% 25%, 75% 100%, 25% 100%, 0% 25%);
    box-shadow: 0 0 30px violet;
    animation: float 3s infinite alternate ease-in-out;
}

.t1 { height: 220px; }
.t2 { height: 180px; }
.t3 { height: 280px; }
.t4 { height: 220px; }

.central-arch {
    width: 200px;
    height: 180px;
    background: linear-gradient(to bottom, cornflowerblue, violet);
    border-radius: 100px 100px 0 0;
    box-shadow: 0 0 50px cornflowerblue;
}

@keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-20px); }
}

.snow-dome {
    position: absolute;
    top: -10%;
    left: 0;
    width: 100%;
    height: 50%;
    border-radius: 50% 50% 0 0;
    background: rgba(255,255,255,0.05);
    pointer-events: none;
    z-index: 3;
}

/* ===== TEAR / RAIN ===== */
.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
    border-radius: 50%;
}

.tear {
    position: absolute;
    width: 6px;
    height: 12px;
    background: linear-gradient(to bottom, cornflowerblue, violet);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity: 0.5;
    filter: drop-shadow(0 0 3px cornflowerblue);
    animation: fall linear infinite;
}

.tear.twinkle {
    animation:
        fall linear infinite,
        shimmer 3s ease-in-out infinite alternate;
}

@keyframes fall {
    0% { transform: translateY(-15vh) translateX(0) rotate(0deg); opacity:0.3; }
    50% { transform: translateY(50vh) translateX(5px) rotate(10deg); }
    100% { transform: translateY(110vh) translateX(-5px) rotate(20deg); opacity:0.6; }
}

@keyframes shimmer {
    from { opacity: 0.3; filter: drop-shadow(0 0 2px violet); }
    to { opacity: 0.7; filter: drop-shadow(0 0 6px cornflowerblue); }
}

/* ===== NAV ===== */
nav {
    display: none;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(20,0,40,0.85);
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 15;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 30px;
}

nav li {
    cursor: pointer;
    color: cornflowerblue;
    transition: 0.3s;
}

nav li:hover { color: violet; }

nav h1 {
    font-family: 'UnifrakturCook', cursive;
    font-size: 2.5rem;
    background: linear-gradient(to bottom, cornflowerblue, #d3d3d3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
}

#datetime {
    color: cornflowerblue;
    font-family: Orbitron, monospace;
    font-size: 0.9rem;
}

/* ===== SECTIONS ===== */
.section {
    display: none;
    text-align: center;
    padding: 100px 20px;
    position: relative;
    overflow: visible;
}

/* ===== MUTE CRYSTAL ===== */
.mute-crystal {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 60px;
    background: linear-gradient(violet, cornflowerblue);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 20px violet;
    cursor: pointer;
    display: none;
}
.mute-crystal.muted { opacity: 0.4; }

/* ===== CHATBOTS ===== */
.chatbot-box{
  width:120px; height:140px; padding:10px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; border-radius:15px; cursor:pointer;
  box-shadow:0 0 20px rgba(255,255,255,0.3); transition: transform 0.3s;
}
.chatbot-box:hover { transform: scale(1.05); }

/* ===== VIDEO SCROLLABLE / NARROW ===== */
#home-video {
  position: relative;
  margin: 0 auto;
  display: block;
  width: 60%;           /* narrow version */
  max-width: 600px;
  height: auto;
  border-radius: 15px;
  box-shadow: 0 0 10px rgba(138,43,226,0.6);
  z-index: 0;
  object-fit: cover;
}
</style>
</head>
<body>

<div class="particles"></div>

<div id="activation">
    <div class="enter-crystal" onclick="activateSite()"></div>
    <p>Click the crystal to enter</p>
</div>

<div id="loading-screen">
    <div class="palace-glow"></div>
    <div class="palace">
        <div class="tower t1"></div>
        <div class="tower t2"></div>
        <div class="central-arch"></div>
        <div class="tower t3"></div>
        <div class="tower t4"></div>
    </div>
    <div class="snow-dome"></div>
</div>

<audio id="bg-music" loop>
    <source src="ambient.mp3" type="audio/mpeg">
</audio>

<audio id="click-sound">
    <source src="chime.mp3" type="audio/mpeg">
</audio>

<nav>
    <h1>Chez Chat Cafe</h1>
    <ul>
        <li onclick="showSection('home')">Home</li>
        <li onclick="showSection('poetry')">Poetry</li>
        <li onclick="showSection('music')">Music</li>
        <li onclick="showSection('lore')">Lore</li>
    </ul>
    <div id="datetime"></div>
</nav>

<!-- ===== HOME SECTION WITH VIDEO & CHATBOTS ===== -->
<div id="home" class="section">
  <video autoplay muted playsinline id="home-video">
    <source src="starflightcrop.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div style="position: relative; z-index: 1; display:flex; flex-direction:column; align-items:center; padding: 40px 0 100px 0;">
    <h2>Welcome to Chez Chat Cafe</h2>

    <!-- Chatbots Container -->
    <div style="display:flex; gap: 20px; margin-top: 40px; flex-wrap:wrap; justify-content:center;">
      <div class="chatbot-box" onclick="openChat('star')" style="background:#2e004b; color:white;">
        <img src="placeholder.png" alt="Star" style="width:80px;height:80px;border-radius:15px; margin-bottom:10px;">
        <div>STAR</div>
      </div>
      <div class="chatbot-box" onclick="openChat('milo')" style="background:#003300; color:white;">
        <img src="placeholder.png" alt="Milo" style="width:80px;height:80px;border-radius:15px; margin-bottom:10px;">
        <div>MILO</div>
      </div>
      <div class="chatbot-box" onclick="openChat('hans')" style="background:#1a1a1a; color:white;">
        <img src="placeholder.png" alt="Hans" style="width:80px;height:80px;border-radius:15px; margin-bottom:10px;">
        <div>HANS</div>
      </div>
    </div>
  </div>
</div>

<div id="poetry" class="section"><h2>Romantic & Victorian Poetry</h2></div>
<div id="music" class="section"><h2>80s Synthwave & New Wave</h2></div>
<div id="lore" class="section"><h2>Gothic Lore & History</h2></div>

<!-- Chat Modal -->
<div id="chat-modal" style="position:fixed; inset:0; display:none; background:rgba(0,0,0,0.8); z-index:20; justify-content:center; align-items:center;">
  <div style="background:#0a0a20; border-radius:20px; width:90%; max-width:400px; padding:20px; display:flex; flex-direction:column;">
    <div id="chat-header" style="font-weight:bold; margin-bottom:10px;">Chat</div>
    <div id="chat-messages" style="flex:1; overflow-y:auto; height:200px; margin-bottom:10px;"></div>
    <input id="chat-input" placeholder="Type here..." style="padding:8px; border-radius:10px; border:none; width:100%;">
    <button onclick="closeChat()" style="margin-top:10px; padding:8px 12px; border-radius:10px;">Close</button>
  </div>
</div>

<div class="mute-crystal" onclick="toggleMute()"></div>

<script>
let activated=false, isMuted=false;

function startTearRain(){
    const container=document.querySelector(".particles");
    for(let i=0;i<60;i++){
        let drop=document.createElement("div");
        drop.className="tear";
        if(Math.random()<0.3) drop.classList.add("twinkle");
        drop.style.left=Math.random()*100+"vw";
        drop.style.animationDuration=(10+Math.random()*6)+"s";
        drop.style.opacity=0.3+Math.random()*0.4;
        container.appendChild(drop);
    }
}

function activateSite(){
    if(activated) return;
    activated=true;
    const music=document.getElementById("bg-music");
    music.volume=0.5; music.play();
    startTearRain();
    document.getElementById("activation").style.display="none";
    document.getElementById("loading-screen").style.display="flex";
    setTimeout(()=>{
        document.getElementById("loading-screen").style.display="none";
        document.querySelector("nav").style.display="flex";
        document.getElementById("home").style.display="block";
        document.querySelector(".mute-crystal").style.display="block";
        document.body.style.overflow="auto";
    },9000);
}

function playClick(){ if(isMuted) return; const click=document.getElementById("click-sound"); click.currentTime=0; click.play(); }
function showSection(id){ document.querySelectorAll(".section").forEach(s=>s.style.display="none"); document.getElementById(id).style.display="block"; playClick(); }
function toggleMute(){ const music=document.getElementById("bg-music"); isMuted=!isMuted; music.muted=isMuted; document.querySelector(".mute-crystal").classList.toggle("muted"); playClick(); }
function updateDateTime(){ const now=new Date(); const options={ weekday:'short', year:'numeric', month:'short', day:'numeric' }; const timeStr=now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}); const dateStr=now.toLocaleDateString([], options); document.getElementById("datetime").innerText=`${dateStr} ${timeStr}`;}
setInterval(updateDateTime,1000); updateDateTime();

/* CHATBOTS */
const chatData={star:{color:'purple',messages:["Hello, I'm Star 🌟. How are you feeling today?","Coffee can help, but so can chatting a little!","Want to share how your day has been?"]},milo:{color:'green',messages:["Hi, I'm Milo 🌿. I can teach you about herbs and teas.","You're my temporary apprentice! Let's start with chamomile.","Do you want to learn about brewing techniques?"]},hans:{color:'lightgray',messages:["Greetings, I'm Hans 🧛. Tea etiquette is serious business.","Yes, I used to be a vampire, but now I serve fine teas.","Careful with the sugar; sophistication is key!"]}};
let currentChat=null,msgIndex=0;
function openChat(name){ currentChat=chatData[name]; msgIndex=0; document.getElementById('chat-modal').style.display='flex'; document.getElementById('chat-header').innerText=name.toUpperCase(); document.getElementById('chat-messages').innerHTML=''; showNextMessage();}
function showNextMessage(){ if(!currentChat) return; if(msgIndex<currentChat.messages.length){ const chatBox=document.getElementById('chat-messages'); const msgDiv=document.createElement('div'); msgDiv.innerText=currentChat.messages[msgIndex]; msgDiv.style.color=currentChat.color; msgDiv.style.margin='5px 0'; chatBox.appendChild(msgDiv); chatBox.scrollTop=chatBox.scrollHeight; msgIndex++; } }
document.getElementById('chat-input').addEventListener('keydown',function(e){ if(e.key==='Enter' && this.value.trim()!==''){ const chatBox=document.getElementById('chat-messages'); const userMsg=document.createElement('div'); userMsg.innerText=this.value; userMsg.style.color='white'; userMsg.style.textAlign='right'; chatBox.appendChild(userMsg); chatBox.scrollTop=chatBox.scrollHeight; this.value=''; setTimeout(showNextMessage,800); }});
function closeChat(){ document.getElementById('chat-modal').style.display='none'; currentChat=null;}
</script>

</body>
</html>
