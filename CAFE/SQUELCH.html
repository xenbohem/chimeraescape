<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chez Chat Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturCook:wght@700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
html, body {
    margin:0;
    padding:0;
    background:#050010;
    color:white;
    font-family:'Cinzel', serif;
    overflow-x:hidden;
}

/* ACTIVATION */
#activation {
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:radial-gradient(circle,#140020,#000);
    z-index:10;
}

.enter-crystal {
    width:80px;
    height:100px;
    background:linear-gradient(violet,cornflowerblue);
    clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
    box-shadow:0 0 40px violet;
    cursor:pointer;
    transition:transform 1s;
}
.enter-crystal:hover { transform:rotate(360deg); }

/* SNOWGLOBE PALACE */
#loading-screen {
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:70vmin;
    height:70vmin;
    border-radius:50%;
    background:radial-gradient(circle,rgba(138,43,226,0.4),#1a0033);
    display:none;
    justify-content:center;
    align-items:flex-end;
    overflow:hidden;
}

.tower {
    width:60px;
    background:linear-gradient(145deg,violet,cornflowerblue,#4b0082);
    clip-path:polygon(50% 0%,100% 25%,75% 100%,25% 100%,0% 25%);
    box-shadow:0 0 20px violet;
}
.t1,.t4 { height:200px; }
.t2,.t3 { height:240px; }

.central {
    width:160px;
    height:150px;
    background:linear-gradient(to bottom,cornflowerblue,violet);
    border-radius:80px 80px 0 0;
    box-shadow:0 0 40px cornflowerblue;
}

.palace {
    display:flex;
    align-items:flex-end;
    gap:15px;
}

/* TEAR RAIN */
.particles {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
}
.tear {
    position:absolute;
    width:5px;
    height:10px;
    background:linear-gradient(to bottom,cornflowerblue,violet);
    border-radius:50%;
    opacity:0.4;
    animation:fall linear infinite;
}
@keyframes fall {
    from { transform:translateY(-10vh); }
    to { transform:translateY(110vh); }
}

/* NAV */
nav {
    display:none;
    justify-content:space-between;
    padding:20px 40px;
    background:rgba(20,0,40,0.9);
    position:sticky;
    top:0;
    z-index:5;
}
nav h1 {
    font-family:'UnifrakturCook', cursive;
    background:linear-gradient(to bottom,cornflowerblue,#d3d3d3);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
nav ul { display:flex; gap:25px; list-style:none; }
nav li { cursor:pointer; color:cornflowerblue; }
nav li:hover { color:violet; }

/* HERO WINDOW FRAME */
.hero {
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:80px 20px 40px 20px;
}

.window-frame {
    position:relative;
    width:420px;
    padding:20px;
    border:3px solid rgba(138,43,226,0.6);
    border-radius:220px 220px 20px 20px;
    box-shadow:0 0 60px rgba(138,43,226,0.4);
    background:rgba(255,255,255,0.02);
}

#home-video {
    width:100%;
    border-radius:200px 200px 15px 15px;
    display:block;
}

/* TITLE OVERLAY */
#video-title-overlay {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-40%);
    font-family:'UnifrakturCook', cursive;
    font-size:2.5rem;
    background:linear-gradient(to bottom,cornflowerblue,#d3d3d3);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    opacity:0;
    transition:opacity 2.5s ease, transform 2.5s ease;
    text-align:center;
}
#video-title-overlay.visible {
    opacity:1;
    transform:translate(-50%,-50%);
}

/* CHATBOTS */
.chatbots {
    display:flex;
    gap:25px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:60px;
}
.chatbot-box {
    width:140px;
    height:160px;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 25px rgba(255,255,255,0.2);
    transition:0.3s;
}
.chatbot-box:hover { transform:scale(1.05); }

/* FOOTER */
footer {
    text-align:center;
    padding:40px 20px;
    font-size:0.8rem;
    opacity:0.6;
}

/* MUTE */
.mute-crystal {
    position:fixed;
    bottom:20px;
    right:20px;
    width:45px;
    height:55px;
    background:linear-gradient(violet,cornflowerblue);
    clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
    box-shadow:0 0 20px violet;
    cursor:pointer;
    display:none;
}
</style>
</head>
<body>

<div class="particles"></div>

<div id="activation">
    <div class="enter-crystal" onclick="activateSite()"></div>
    <p>Enter the Realm</p>
</div>

<div id="loading-screen">
  <div class="palace">
    <div class="tower t1"></div>
    <div class="tower t2"></div>
    <div class="central"></div>
    <div class="tower t3"></div>
    <div class="tower t4"></div>
  </div>
</div>

<audio id="bg-music" loop>
<source src="ambient.mp3" type="audio/mpeg">
</audio>

<nav>
<h1>Chez Chat Cafe</h1>
<ul>
<li>Poetry</li>
<li>Music</li>
<li>Lore</li>
</ul>
<div id="datetime"></div>
</nav>

<div class="hero">
<div class="window-frame">
<video autoplay muted playsinline id="home-video">
<source src="star-angel-flying.mp4" type="video/mp4">
</video>
<div id="video-title-overlay">Welcome to Chez Chat Cafe</div>
</div>

<div class="chatbots">
<div class="chatbot-box" style="background:#2e004b;" onclick="window.open('https://example.com/star','_blank')">STAR</div>
<div class="chatbot-box" style="background:#003300;" onclick="window.open('https://example.com/milo','_blank')">MILO</div>
<div class="chatbot-box" style="background:#1a1a1a;" onclick="window.open('https://example.com/hans','_blank')">HANS</div>
</div>
</div>

<footer>
Visual artwork AI-assisted. Site design by Chez Chat Cafe.
</footer>

<div class="mute-crystal" onclick="toggleMute()"></div>

<script>
let activated=false;
function activateSite(){
if(activated) return;
activated=true;
document.getElementById("activation").style.display="none";
document.getElementById("loading-screen").style.display="flex";
document.getElementById("bg-music").play();
setTimeout(()=>{
document.getElementById("loading-screen").style.display="none";
document.querySelector("nav").style.display="flex";
document.querySelector(".mute-crystal").style.display="block";
},8000);
}

const video=document.getElementById("home-video");
video.addEventListener("ended",()=>{
document.getElementById("video-title-overlay").classList.add("visible");
});

function toggleMute(){
const music=document.getElementById("bg-music");
music.muted=!music.muted;
}

function updateDateTime(){
document.getElementById("datetime").innerText=new Date().toLocaleString();
}
setInterval(updateDateTime,1000);

function startTears(){
const container=document.querySelector(".particles");
for(let i=0;i<40;i++){
let drop=document.createElement("div");
drop.className="tear";
drop.style.left=Math.random()*100+"vw";
drop.style.animationDuration=(8+Math.random()*6)+"s";
container.appendChild(drop);
}
}
startTears();
</script>

</body>
</html>
