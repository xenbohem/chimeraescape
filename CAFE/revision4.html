<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chez Chat Cafe</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #050010;
    overflow: hidden;
    font-family: 'Cinzel', serif;
    color: white;
}

/* ===== ACTIVATION SCREEN ===== */
#activation {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: radial-gradient(circle, #140020, #000);
    z-index: 10;
}

.enter-crystal {
    width: 80px;
    height: 100px;
    background: linear-gradient(violet, cornflowerblue);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 40px violet;
    cursor: pointer;
    animation: pulse 2s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); box-shadow: 0 0 20px violet; }
    to { transform: scale(1.1); box-shadow: 0 0 60px cornflowerblue; }
}

/* ===== LOADING ===== */
#loading-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(to top, #2e0066, #4b0082, #6495ed);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.castle-3d { display: flex; gap: 20px; }
.tower {
    width: 60px;
    background: linear-gradient(145deg, violet, cornflowerblue, #4b0082);
    clip-path: polygon(50% 0%, 100% 25%, 75% 100%, 25% 100%, 0% 25%);
    box-shadow: 0 0 40px violet;
    animation: float 2s infinite alternate ease-in-out;
}
.t1 { height: 180px; }
.t2 { height: 220px; }
.t3 { height: 160px; }

@keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-18px); }
}

/* ===== NAV ===== */
nav {
    display: none;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(20,0,40,0.85);
}

nav ul {
    list-style: none;
    display: flex;
    gap: 30px;
}

nav li {
    cursor: pointer;
    color: cornflowerblue;
    transition: 0.3s;
}

nav li:hover {
    color: violet;
}

/* ===== SECTIONS ===== */
.section {
    display: none;
    text-align: center;
    padding: 100px 20px;
}

/* ===== MUTE CRYSTAL ===== */
.mute-crystal {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 60px;
    background: linear-gradient(violet, cornflowerblue);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 20px violet;
    cursor: pointer;
    display: none;
}
.mute-crystal.muted { opacity: 0.4; }

</style>
</head>
<body>

<!-- ACTIVATION -->
<div id="activation">
    <div class="enter-crystal" onclick="activateSite()"></div>
    <p>Click the crystal to enter</p>
</div>

<!-- LOADING -->
<div id="loading-screen">
    <div class="castle-3d">
        <div class="tower t1"></div>
        <div class="tower t2"></div>
        <div class="tower t3"></div>
    </div>
</div>

<!-- AUDIO -->
<audio id="bg-music" loop>
    <source src="ambient.mp3" type="audio/mpeg">
</audio>

<audio id="click-sound">
    <source src="chime.mp3" type="audio/mpeg">
</audio>

<!-- NAV -->
<nav>
    <h1>Chez Chat Cafe</h1>
    <ul>
        <li onclick="showSection('home')">Home</li>
        <li onclick="showSection('poetry')">Poetry</li>
        <li onclick="showSection('music')">Music</li>
        <li onclick="showSection('lore')">Lore</li>
    </ul>
</nav>

<div id="home" class="section"><h2>Welcome to Chez Chat Cafe</h2></div>
<div id="poetry" class="section"><h2>Romantic & Victorian Poetry</h2></div>
<div id="music" class="section"><h2>80s Synthwave & New Wave</h2></div>
<div id="lore" class="section"><h2>Gothic Lore & History</h2></div>

<div class="mute-crystal" onclick="toggleMute()"></div>

<script>

let activated = false;
let isMuted = false;

function activateSite() {
    if (activated) return;
    activated = true;

    const music = document.getElementById("bg-music");
    music.volume = 0.5;
    music.play();

    document.getElementById("activation").style.display = "none";
    document.getElementById("loading-screen").style.display = "flex";

    setTimeout(() => {
        document.getElementById("loading-screen").style.display = "none";
        document.querySelector("nav").style.display = "flex";
        document.getElementById("home").style.display = "block";
        document.querySelector(".mute-crystal").style.display = "block";
        document.body.style.overflow = "auto";
    }, 4000);
}

function playClick() {
    if (isMuted) return;
    const click = document.getElementById("click-sound");
    click.currentTime = 0;
    click.play();
}

function showSection(id) {
    document.querySelectorAll(".section").forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "block";
    playClick();
}

function toggleMute() {
    const music = document.getElementById("bg-music");
    isMuted = !isMuted;
    music.muted = isMuted;
    document.querySelector(".mute-crystal").classList.toggle("muted");
    playClick();
}

</script>

</body>
</html>
