<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chez Chat Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturCook:wght@700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #050010;
    font-family: 'Cinzel', serif;
    color: white;
    overflow-x: hidden;
}

/* ===== VIDEO IN A CIRCULAR GLOBE ===== */
#globe-video-frame {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 80vmin;
  height: 80vmin;
  border-radius: 50%;
  overflow: hidden;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 80px rgba(138,43,226,0.7), inset 0 0 60px rgba(75,0,130,0.5);
  border: 5px solid rgba(138,43,226,0.5);
  z-index: -1;
}

#globe-video-frame video {
  width: 100%;
  height: 100%;
  object-fit: cover; /* fill the globe */
  object-position: top center; /* keep head visible */
  filter: brightness(0.8);
}

/* Optional particles inside globe */
.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

/* ===== ACTIVATION SCREEN ===== */
#activation {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: radial-gradient(circle, #140020, #000);
    z-index: 10;
}

.enter-crystal {
    width: 80px;
    height: 100px;
    background: linear-gradient(violet, cornflowerblue);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 40px violet;
    cursor: pointer;
    animation: pulse 2s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); box-shadow: 0 0 20px violet; }
    to { transform: scale(1.1); box-shadow: 0 0 60px cornflowerblue; }
}

/* ===== NAV ===== */
nav {
    display: none;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(20,0,40,0.9);
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 15;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 30px;
}

nav li {
    cursor: pointer;
    color: cornflowerblue;
    transition: 0.3s;
}

nav li:hover { color: violet; }

nav h1 {
    font-family: 'UnifrakturCook', cursive;
    font-size: 2.5rem;
    margin: 0;
}

#datetime {
    color: cornflowerblue;
    font-family: Orbitron, monospace;
    font-size: 0.9rem;
}

/* ===== WELCOME TITLE ===== */
.welcome-title-container {
  display: inline-block;
  padding: 20px 40px;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(8px);
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(100,149,237,0.5);
  margin-bottom: 40px;
  position: relative;
  z-index: 5;
  animation: floatText 4s ease-in-out infinite alternate;
}

.welcome-title {
  font-size: 3rem;
  margin: 0;
  background: linear-gradient(to bottom, cornflowerblue, #d3d3d3);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 25px rgba(100,149,237,0.6);
}

@keyframes floatText {
  from { transform: translateY(0); }
  to { transform: translateY(-15px); }
}

/* ===== CHAT LAYOUT ===== */
#chat-layout{
  display:flex;
  gap:40px;
  justify-content:center;
  align-items:flex-start;
  margin-top:20px;
  flex-wrap:wrap;
}

#bot-select{
  width:250px;
  display:flex;
  flex-direction:column;
  gap:20px;
  align-items:center;
}

.chatbot-box{
  width:140px;
  padding:15px;
  border-radius:15px;
  cursor:pointer;
  text-align:center;
  box-shadow:0 0 20px rgba(255,255,255,0.3);
  transition:0.3s;
}

.chatbot-box:hover { transform: scale(1.05); }

.purple{ background:#2e004b; }
.green{ background:#003300; }
.dark{ background:#1a1a1a; }

/* ===== CIRCULAR CHAT WINDOW ===== */
#chat-window{
  width: min(60vmin, 400px);
  height: min(60vmin, 400px);
  border-radius:50%;
  background: radial-gradient(circle at center,
      rgba(138,43,226,0.25),
      rgba(0,0,0,0.9));
  border:3px solid rgba(138,43,226,0.5);
  box-shadow:
      0 0 60px rgba(138,43,226,0.6),
      inset 0 0 80px rgba(75,0,130,0.6);
  padding:30px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  animation: globePulse 6s ease-in-out infinite alternate;
  z-index: 5;
}

@keyframes globePulse{
  from{
    box-shadow:
      0 0 60px rgba(138,43,226,0.5),
      inset 0 0 80px rgba(75,0,130,0.5);
  }
  to{
    box-shadow:
      0 0 100px rgba(138,43,226,0.8),
      inset 0 0 120px rgba(75,0,130,0.7);
  }
}

#chat-header-full{
  font-weight:bold;
  margin-bottom:15px;
  font-size:1.2rem;
  color:cornflowerblue;
}

#chat-messages-full{
  flex:1;
  overflow-y:auto;
  margin:10px 0;
  text-align:left;
}

#chat-input-area{
  display:flex;
  gap:10px;
  margin-top:10px;
}

#chat-input-full{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#1a1a35;
  color:white;
}

#chat-input-area button{
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:cornflowerblue;
  cursor:pointer;
}

/* ===== MESSAGE ANIMATION ===== */
.chat-message{
  margin:10px 0;
  animation: fadeIn 0.6s ease forwards;
}

@keyframes fadeIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

/* ===== MUTE CRYSTAL ===== */
.mute-crystal {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 60px;
    background: linear-gradient(violet, cornflowerblue);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 20px violet;
    cursor: pointer;
    display: none;
}
.muted { opacity:0.4; }
</style>
</head>
<body>

<!-- CIRCULAR GLOBE VIDEO -->
<div id="globe-video-frame">
  <video autoplay muted loop playsinline>
    <source src="starflightcrop.mp4" type="video/mp4">
  </video>
</div>

<div class="particles"></div>

<div id="activation">
    <div class="enter-crystal" onclick="activateSite()"></div>
    <p>Click the crystal to enter</p>
</div>

<audio id="bg-music" loop>
    <source src="ambient.mp3" type="audio/mpeg">
</audio>

<nav>
    <h1>Chez Chat Cafe</h1>
    <ul>
        <li onclick="showSection('home')">Home</li>
        <li onclick="showSection('chat')">Chat</li>
        <li onclick="showSection('poetry')">Poetry</li>
        <li onclick="showSection('music')">Music</li>
        <li onclick="showSection('lore')">Lore</li>
    </ul>
    <div id="datetime"></div>
</nav>

<!-- HOME -->
<div id="home" class="section">
  <div class="welcome-title-container">
    <h2 class="welcome-title">Welcome to Chez Chat Cafe</h2>
  </div>
</div>

<!-- CHAT -->
<div id="chat" class="section">
  <div id="chat-layout">
    <div id="bot-select">
      <h2>Choose Your Companion</h2>
      <div class="chatbot-box purple" onclick="startFullChat('star')">STAR</div>
      <div class="chatbot-box green" onclick="startFullChat('milo')">MILO</div>
      <div class="chatbot-box dark" onclick="startFullChat('hans')">HANS</div>
    </div>

    <div id="chat-window">
      <div id="chat-header-full">Select a companion</div>
      <div id="chat-messages-full"></div>
      <div id="chat-input-area">
        <input id="chat-input-full" placeholder="Speak your thoughts..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<div id="poetry" class="section"><h2>Romantic & Victorian Poetry</h2></div>
<div id="music" class="section"><h2>80s Synthwave & New Wave</h2></div>
<div id="lore" class="section"><h2>Gothic Lore & History</h2></div>

<div class="mute-crystal" onclick="toggleMute()"></div>

<script>
let activated=false,isMuted=false;

/* Activation */
function activateSite(){
 if(activated) return;
 activated=true;
 document.getElementById("activation").style.display="none";
 document.querySelector("nav").style.display="flex";
 document.getElementById("home").style.display="block";
 document.querySelector(".mute-crystal").style.display="block";
 const music=document.getElementById("bg-music");
 music.volume=0.5;
 music.play();
 startTearRain();
}

/* Tear Rain */
function startTearRain(){
 const container=document.querySelector(".particles");
 for(let i=0;i<40;i++){
   let drop=document.createElement("div");
   drop.className="tear";
   drop.style.left=Math.random()*100+"vw";
   drop.style.animationDuration=(8+Math.random()*6)+"s";
   container.appendChild(drop);
 }
}

/* Navigation */
function showSection(id){
 document.querySelectorAll(".section").forEach(s=>s.style.display="none");
 document.getElementById(id).style.display="block";
}

/* Mute */
function toggleMute(){
 const music=document.getElementById("bg-music");
 isMuted=!isMuted;
 music.muted=isMuted;
 document.querySelector(".mute-crystal").classList.toggle("muted");
}

/* Clock */
function updateDateTime(){
 document.getElementById("datetime").innerText=new Date().toLocaleString();
}
setInterval(updateDateTime,1000);

/* CHAT WITH PERSISTENT MEMORY */
const chatData={
 star:{color:'violet',messages:["Hello, I'm Star 🌟.","How are you feeling today?"]},
 milo:{color:'#00aa55',messages:["Hi, I'm Milo 🌿.","Shall we brew something calming?"]},
 hans:{color:'lightgray',messages:["Greetings, I'm Hans 🧛.","Refinement is everything."]}
};

let currentChat=null,currentName=null,msgIndex=0;

function startFullChat(name){
 currentChat=chatData[name];
 currentName=name;
 msgIndex=0;

 document.getElementById("chat-header-full").innerText=name.toUpperCase();
 const box=document.getElementById("chat-messages-full");
 box.innerHTML="";

 const saved=localStorage.getItem("chat_"+name);
 if(saved){
   box.innerHTML=saved;
   box.scrollTop=box.scrollHeight;
 } else {
   showNextMessage();
 }
}

function saveChat(){
 if(!currentName) return;
 localStorage.setItem("chat_"+currentName,
   document.getElementById("chat-messages-full").innerHTML);
}

function showNextMessage(){
 if(!currentChat) return;
 if(msgIndex<currentChat.messages.length){
  const box=document.getElementById("chat-messages-full");
  const div=document.createElement("div");
  div.className="chat-message";
  div.innerText=currentChat.messages[msgIndex];
  div.style.color=currentChat.color;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
  msgIndex++;
  saveChat();
 }
}

function sendMessage(){
 const input=document.getElementById("chat-input-full");
 if(!currentChat || input.value.trim()==="") return;

 const box=document.getElementById("chat-messages-full");
 const user=document.createElement("div");
 user.className="chat-message";
 user.innerText=input.value;
 user.style.textAlign="right";
 box.appendChild(user);
 box.scrollTop=box.scrollHeight;

 input.value="";
 saveChat();
 setTimeout(showNextMessage,800);
}

document.getElementById("chat-input-full")
.addEventListener("keydown",e=>{
 if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
