<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chez Chat Cafe</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturCook:wght@700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
body {
    margin: 0;
    background: radial-gradient(circle at center, #120024, #050010);
    color: white;
    font-family: 'Cinzel', serif;
    overflow: hidden;
    opacity: 0;
    transition: opacity 2s ease;
}

body.visible { opacity: 1; }

/* ================= STAINED GLASS RAYS ================= */
.light-rays {
    position: fixed;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: radial-gradient(circle,
        rgba(138,43,226,0.2),
        rgba(100,149,237,0.15),
        rgba(75,0,130,0.2),
        transparent 60%);
    animation: rotateRays 90s linear infinite;
    pointer-events: none;
    z-index: 0;
}
@keyframes rotateRays {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ================= GLOW TEXT ================= */
.glow-text {
    opacity: 0;
    animation: glowReveal 3s forwards;
}
@keyframes glowReveal {
    0% { opacity: 0; letter-spacing: 12px; }
    100% { opacity: 1; letter-spacing: 2px;
        text-shadow: 0 0 15px violet, 0 0 30px cornflowerblue; }
}

/* ================= LOADING SCREEN ================= */
#loading-screen {
    position: fixed;
    width: 100%;
    height: 100vh;
    background: linear-gradient(to top, #2e0066, #4b0082, #6495ed);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 100;
}

.castle-3d { display: flex; gap: 20px; }

.tower {
    width: 60px;
    background: linear-gradient(145deg, violet, cornflowerblue, #4b0082);
    clip-path: polygon(50% 0%, 100% 25%, 75% 100%, 25% 100%, 0% 25%);
    box-shadow: 0 0 40px violet;
    animation: float 2s infinite alternate;
}
.t1 { height: 180px; }
.t2 { height: 220px; }
.t3 { height: 160px; }

@keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(-20px); }
}

.epic-core {
    margin-top: 40px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid cornflowerblue;
    box-shadow: 0 0 50px violet, inset 0 0 30px cornflowerblue;
    animation: spin 4s linear infinite;
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ================= NAV ================= */
nav {
    display: none;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(20,0,40,0.8);
    position: relative;
    z-index: 2;
}

.logo {
    font-family: 'UnifrakturCook', cursive;
    font-size: 28px;
    color: violet;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 30px;
}

nav a {
    color: cornflowerblue;
    text-decoration: none;
    cursor: pointer;
}

.section {
    display: none;
    text-align: center;
    padding: 80px 20px;
    position: relative;
    z-index: 2;
}

/* ================= PARTICLES ================= */
.particles {
    position: fixed;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.crystal {
    position: absolute;
    width: 10px;
    height: 20px;
    background: linear-gradient(violet, cornflowerblue);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    opacity: 0.6;
    animation: drift linear infinite;
}
@keyframes drift {
    from { transform: translateY(-100vh); }
    to { transform: translateY(100vh); }
}

/* ================= MUTE CRYSTAL ================= */
.mute-crystal {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 60px;
    background: linear-gradient(violet, cornflowerblue);
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow: 0 0 20px violet;
    cursor: pointer;
    z-index: 3;
}
.mute-crystal.muted { opacity: 0.4; }

</style>
</head>

<body>

<div class="light-rays"></div>

<audio id="bg-music" loop>
    <source src="ambient.mp3" type="audio/mpeg">
</audio>

<div id="loading-screen">
    <div class="castle-3d">
        <div class="tower t1"></div>
        <div class="tower t2"></div>
        <div class="tower t3"></div>
    </div>
    <div class="epic-core"></div>
</div>

<div class="particles"></div>

<nav>
    <h1 class="logo glow-text">Chez Chat Cafe</h1>
    <ul>
        <li onclick="showSection('home')">Home</li>
        <li onclick="showSection('poetry')">Poetry</li>
        <li onclick="showSection('music')">Music</li>
        <li onclick="showSection('lore')">Lore</li>
    </ul>
</nav>

<div id="home" class="section">
    <h2 class="glow-text">Welcome to the Velvet Realms</h2>
</div>

<div id="poetry" class="section">
    <h2 class="glow-text">Poetry Realm</h2>
</div>

<div id="music" class="section">
    <h2 class="glow-text">Music Realm</h2>
</div>

<div id="lore" class="section">
    <h2 class="glow-text">Lore Realm</h2>
</div>

<div class="mute-crystal" onclick="toggleMute()"></div>

<script>

/* ================= AUDIO ENGINE ================= */

let audioContext;
let convolver;
let clickBuffer;
let musicSource;
let isMuted = false;

async function setupAudio() {

    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    // Load impulse response
    const irResponse = await fetch("cathedral_ir.wav");
    const irArray = await irResponse.arrayBuffer();
    const irBuffer = await audioContext.decodeAudioData(irArray);

    convolver = audioContext.createConvolver();
    convolver.buffer = irBuffer;

    convolver.connect(audioContext.destination);

    // Load click sound
    const clickResponse = await fetch("chime.mp3");
    const clickArray = await clickResponse.arrayBuffer();
    clickBuffer = await audioContext.decodeAudioData(clickArray);

    // Connect ambient music
    const music = document.getElementById("bg-music");
    musicSource = audioContext.createMediaElementSource(music);
    musicSource.connect(convolver);
}

/* Play spatial cathedral click */
function playClick() {
    if (isMuted) return;

    const source = audioContext.createBufferSource();
    source.buffer = clickBuffer;

    const panner = audioContext.createStereoPanner();
    panner.pan.value = (Math.random() * 2 - 1); // random left/right

    source.connect(panner);
    panner.connect(convolver);

    source.start(0);
}

/* Navigation */
function showSection(id) {
    document.querySelectorAll(".section").forEach(sec => {
        sec.style.display = "none";
    });
    document.getElementById(id).style.display = "block";
    playClick();
}

/* Mute toggle */
function toggleMute() {
    isMuted = !isMuted;
    document.querySelector(".mute-crystal").classList.toggle("muted");
}

/* Floating crystals */
const particleContainer = document.querySelector(".particles");
for (let i = 0; i < 40; i++) {
    let crystal = document.createElement("div");
    crystal.classList.add("crystal");
    crystal.style.left = Math.random() * 100 + "vw";
    crystal.style.animationDuration = (5 + Math.random() * 10) + "s";
    particleContainer.appendChild(crystal);
}

/* Start everything on first click */
document.addEventListener("click", async function init() {

    if (!audioContext) {
        await setupAudio();
        document.getElementById("bg-music").play();
    }

    document.body.classList.add("visible");

    document.removeEventListener("click", init);
});

/* 7 second intro */
setTimeout(() => {
    document.getElementById("loading-screen").style.display = "none";
    document.querySelector("nav").style.display = "flex";
    document.getElementById("home").style.display = "block";
    document.body.style.overflow = "auto";
}, 7000);

</script>

</body>
</html>
